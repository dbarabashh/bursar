name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm audit signatures
      - run: npm run format:check
        if: matrix.os == 'ubuntu-latest'
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  # Run the real installers on clean machines and check the daemon and the isolation.
  install-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run setup -- --yes --no-claude --no-passkey < /dev/null
      - name: daemon runs as bursar and answers
        run: |
          systemctl is-active bursar
          test "$(ps -o user= -p "$(systemctl show -p MainPID --value bursar)")" = bursar
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8402/v1/budget)" = 401
          TOKEN=$(sudo sed -n "s/^ *token: '\(.*\)'$/\1/p" /var/lib/bursar/policy.yaml)
          curl -sf -H "Authorization: Bearer $TOKEN" http://127.0.0.1:8402/v1/budget
      - name: the runner user cannot read the key or change the policy
        # `! cmd` does not fail a bash -e step, so check each one explicitly.
        run: |
          if cat /var/lib/bursar/key; then exit 1; fi
          if sh -c 'echo x >> /var/lib/bursar/policy.yaml'; then exit 1; fi
          if touch /opt/bursar/app/src/index.ts; then exit 1; fi
      - run: |
          sudo ./scripts/uninstall-linux.sh
          if systemctl is-active bursar; then exit 1; fi

  install-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      # The runner shell is already elevated.
      - run: npm run setup -- --yes --no-claude --no-passkey
      - name: daemon runs as NT SERVICE\bursar and answers
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ((Get-Service bursar).Status -ne 'Running') { throw 'service not running' }
          $account = (Get-CimInstance Win32_Service -Filter "Name='bursar'").StartName
          if ($account -ne 'NT SERVICE\bursar') { throw "service runs as $account" }
          try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8402/v1/budget | Out-Null; throw 'no 401' }
          catch [System.Net.WebException] { if ([int]$_.Exception.Response.StatusCode -ne 401) { throw } }
          $token = (Select-String -Path "$env:ProgramData\bursar\policy.yaml" -Pattern "token: '(.*)'").Matches[0].Groups[1].Value
          Invoke-RestMethod -Headers @{ Authorization = "Bearer $token" } http://127.0.0.1:8402/v1/budget
          $acl = (Get-Acl "$env:ProgramData\bursar\key").Access | ForEach-Object { $_.IdentityReference.Value }
          $acl
          if ($acl | Where-Object { $_ -notin 'NT AUTHORITY\SYSTEM', 'BUILTIN\Administrators', 'NT SERVICE\bursar' }) { throw 'key ACL too wide' }
      - shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\uninstall-windows.ps1
          if (Get-Service bursar -ErrorAction SilentlyContinue) { throw 'service still there' }
