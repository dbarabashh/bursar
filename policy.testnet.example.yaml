version: 1

wallet:
  keyfile: /var/db/bursar/key

agents:
  - id: claude-code
    token: '__AGENT_TOKEN__'

limits:
  per_tx: { usd: 0.10 }
  per_day: { usd: 1.00, window: calendar_utc }
  per_recipient_day: { usd: 1.00 }
  velocity: { max_tx: 10, per_seconds: 60 }
  wallet_per_day: { usd: 1.00 }
  per_month: { usd: 5.00 }
  per_task: { max_usd: 0.50, max_ttl_seconds: 3600 }
  approval_threshold:
    {
      usd: 0.05,
      timeout_seconds: 600,
      method: passkey,
      user_verification: required,
    }

allow:
  chains: ['eip155:84532']
  assets:
    - {
        address: '0x036CbD53842c5426634e7929541eC2318f3dCF7e',
        chains: ['eip155:84532'],
        label: USDC on Base Sepolia,
      }
  recipients:
    - {
        address: '__PAY_TO__',
        label: my-test-merchant,
        chains: ['eip155:84532'],
      }

state:
  dir: /var/db/bursar

mode: enforce
